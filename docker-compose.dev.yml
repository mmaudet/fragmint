# docker-compose.dev.yml
# Full dev stack with hot reload — no server restart needed on code changes.
# Start: docker compose -f docker-compose.dev.yml up
name: fragmint-dev
services:
  fragmint:
    container_name: fragmint-server
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3210:3210"
    volumes:
      - ./packages/server/src:/app/packages/server/src
      - ./example-vault:/data/vault
    environment:
      FRAGMINT_JWT_SECRET: changeme-dev
      FRAGMINT_STORE_PATH: /data/vault
      FRAGMINT_MILVUS_ENABLED: "true"
      FRAGMINT_MILVUS_ADDRESS: milvus:19530
      # All AI settings are sourced from .env at repo root (see .env.example).
      # LLM and embedding can use different endpoints, keys, and models.
      FRAGMINT_LLM_ENDPOINT: ${FRAGMINT_LLM_ENDPOINT}
      FRAGMINT_LLM_API_KEY: ${FRAGMINT_LLM_API_KEY}
      FRAGMINT_LLM_MODEL: ${FRAGMINT_LLM_MODEL}
      FRAGMINT_EMBEDDING_ENDPOINT: ${FRAGMINT_EMBEDDING_ENDPOINT}
      FRAGMINT_EMBEDDING_API_KEY: ${FRAGMINT_EMBEDDING_API_KEY}
      FRAGMINT_EMBEDDING_MODEL: ${FRAGMINT_EMBEDDING_MODEL}
      FRAGMINT_EMBEDDING_DIMENSIONS: ${FRAGMINT_EMBEDDING_DIMENSIONS}
      FRAGMINT_LLM_TIMEOUT: "300000"
      FRAGMINT_PLAN_DOCX_REFERENCE: /data/vault/templates/Template_Offre_LINAGORA.docx
      FRAGMINT_PLAN_DOCX_REFERENCE_NAME: Offre Linagora
      # Trust the bind-mounted vault repo despite host/container UID mismatch.
      # Git reads these on every invocation; no rebuild needed.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /data/vault
    depends_on:
      milvus:
        condition: service_healthy

  web:
    container_name: fragmint-web
    build:
      context: .
      dockerfile: Dockerfile
      target: web-dev
    ports:
      - "5173:5173"
    volumes:
      - ./packages/web/src:/app/packages/web/src
      - ./packages/web/index.html:/app/packages/web/index.html
    environment:
      API_HOST: http://fragmint:3210
    depends_on:
      - fragmint

  milvus:
    container_name: fragmint-milvus
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  milvus-data:
