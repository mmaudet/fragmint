# docker/docker-compose.dev.yml
# Full dev stack with hot reload — no server restart needed on code changes.
# Start: docker compose -f docker/docker-compose.dev.yml up
name: fragmint-dev
services:
  fragmint:
    container_name: fragmint-server
    build:
      context: ..
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3210:3210"
    volumes:
      - ../packages/server/src:/app/packages/server/src
      - ../example-vault:/data/vault
    environment:
      FRAGMINT_JWT_SECRET: changeme-dev
      FRAGMINT_STORE_PATH: /data/vault
      FRAGMINT_MILVUS_ENABLED: "true"
      FRAGMINT_MILVUS_ADDRESS: milvus:19530
      FRAGMINT_EMBEDDING_ENDPOINT: http://host.docker.internal:11434/v1
      FRAGMINT_LLM_ENDPOINT: http://host.docker.internal:11434/v1
      FRAGMINT_LLM_MODEL: mistral-nemo:12b
      FRAGMINT_LLM_TIMEOUT: "300000"
    depends_on:
      milvus:
        condition: service_healthy

  web:
    container_name: fragmint-web
    build:
      context: ..
      dockerfile: Dockerfile
      target: web-dev
    ports:
      - "5173:5173"
    volumes:
      - ../packages/web/src:/app/packages/web/src
      - ../packages/web/index.html:/app/packages/web/index.html
    environment:
      API_HOST: http://fragmint:3210
    depends_on:
      - fragmint

  milvus:
    container_name: fragmint-milvus
    image: milvusdb/milvus:v2.4.17
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  milvus-data:
