id: tpl-propale-pptx-001
name: Proposition Commerciale — PPTX
description: Template de présentation PowerPoint pour propositions commerciales Linagora
output_format: pptx
version: "1.0"
author: fragmint-admin
carbone_template: propale-pptx.md

fragments:
  - key: fragments
    type: argument
    domain: linagora-corp
    lang: fr
    count: 3
    required: false
    fallback: empty
    quality_min: approved

context_schema:
  title:
    label: Titre de la présentation
    type: string
  client:
    label: Nom du client
    type: string
  date:
    label: Date de la proposition
    type: string
  reference:
    label: Référence interne
    type: string
  context:
    label: Contexte et enjeux du client
    type: string
  approach:
    label: Notre approche méthodologique
    type: string
  team:
    label: Présentation équipe et références clients
    type: string
  planning:
    label: Planning prévisionnel
    type: string
  company_name:
    label: Nom de la société
    type: string
  contact_email:
    label: Email de contact
    type: string
  next_steps:
    label: Prochaines étapes
    type: string
  total_ht:
    label: Total HT (€)
    type: string
  tva:
    label: TVA (€)
    type: string
  total_ttc:
    label: Total TTC (€)
    type: string
